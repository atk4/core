name: Unit

on:
  push:

jobs:
  unit-test-coverage-repro:
    name: Unit Coverage Repro
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mvorisek/image-php:${{ matrix.php }}
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
        type: ['Phpunit']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure PHP
        run: |
          php --version

      - name: "Run tests /wo opcache"
        run: |
          i=0
          while [ "$i" -lt 1000 ]; do
              php -d opcache.enable_cli=0 repro.php
              if [ $? -ne 0 ]; then
                  exit $?
              fi
              i=$((i + 1))
          done

      - name: "Run tests /w opcache"
        run: |
          i=0
          while [ "$i" -lt 1000 ]; do
              php -d opcache.enable_cli=1 repro.php
              if [ $? -ne 0 ]; then
                  exit $?
              fi
              i=$((i + 1))
          done
